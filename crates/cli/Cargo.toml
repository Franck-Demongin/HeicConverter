[package]
name = "heic-converter-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interface en ligne de commande et interface graphique optionnelle pour HEIC Converter."
repository.workspace = true

[[bin]]
name = "heic-converter"
path = "src/main.rs"

[[bin]]
name = "heic-converter-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:slint", "dep:slint-build", "dep:rfd"]

[dependencies]
heic-converter-core.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = { workspace = true, optional = true }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[build-dependencies]
slint-build = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"