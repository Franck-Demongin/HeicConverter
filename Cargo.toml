[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Franck-Demongin"]
description = "Conversion d'images HEIC/HEIF vers JPEG ou PNG, avec interface graphique Slint optionnelle."
repository = "https://github.com/Franck-Demongin/heic-converter"
homepage = "https://github.com/Franck-Demongin/heic-converter"
readme = "README.md"

[workspace.dependencies]
heic-converter-core = { path = "crates/core", version = "0.1.1" }

heic-rs = { version = "=0.1.4", default-features = false, features = ["std", "parallel"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2.0"
directories = "6.0"
tracing = "0.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = "0.3"

slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
slint-build = { version = "1.18", default-features = false, features = [
    "compat-1-18",
    "renderer-software",
] }

[workspace.lints.rust]
unused = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"